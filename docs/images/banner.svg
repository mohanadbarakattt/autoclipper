<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="AutoClipper: livestreams in, viral vertical clips out">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#1a1430"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="150" font-size="76" font-weight="800" fill="#ffffff">AutoClipper</text>
    <rect x="66" y="172" width="260" height="6" rx="3" fill="url(#accent)"/>
    <text x="64" y="236" font-size="30" fill="#cbd5e1">Livestreams in. Viral vertical clips out.</text>
    <text x="64" y="282" font-size="22" fill="#94a3b8">Twitch · Kick · YouTube  →  Shorts · Reels · TikTok</text>
    <g font-size="18" font-weight="700">
      <rect x="64" y="318" width="124" height="36" rx="18" fill="#14532d"/><text x="126" y="342" text-anchor="middle" fill="#86efac">$0 / month</text>
      <rect x="200" y="318" width="168" height="36" rx="18" fill="#1e1b4b"/><text x="284" y="342" text-anchor="middle" fill="#a5b4fc">Gemini + Claude</text>
      <rect x="380" y="318" width="148" height="36" rx="18" fill="#3b0764"/><text x="454" y="342" text-anchor="middle" fill="#f0abfc">1-click install</text>
      <rect x="540" y="318" width="144" height="36" rx="18" fill="#431407"/><text x="612" y="342" text-anchor="middle" fill="#fdba74">GTA 6 preset</text>
    </g>
  </g>
  <!-- wide frame -> phone -->
  <g transform="translate(700,92)">
    <rect width="260" height="146" rx="10" fill="#12304b" stroke="#334155" stroke-width="2"/>
    <rect x="196" y="10" width="54" height="40" rx="4" fill="#2b2b33" stroke="#ffb84d" stroke-width="2"/>
    <rect x="70" y="86" width="26" height="26" fill="#ff3d6e"/>
    <rect x="0" y="118" width="260" height="28" fill="#1b1b22"/>
    <text x="130" y="176" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748b">16:9 stream</text>
  </g>
  <path d="M975 165 h48" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M1016 154 l14 11 l-14 11" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(1046,40)">
    <rect width="132" height="236" rx="18" fill="#000" stroke="#475569" stroke-width="3"/>
    <rect x="8" y="10" width="116" height="74" rx="4" fill="#2b2b33" stroke="#ffb84d" stroke-width="2"/>
    <rect x="16" y="74" width="100" height="18" rx="3" fill="#fff"/>
    <text x="66" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#111">WRONG EXIT?!</text>
    <rect x="8" y="92" width="116" height="130" rx="4" fill="#12304b"/>
    <rect x="50" y="150" width="30" height="30" fill="#ff3d6e"/>
    <text x="66" y="206" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="13" font-weight="900"><tspan fill="#facc15">NO</tspan><tspan fill="#fff"> WAY</tspan></text>
  </g>
  <text x="1112" y="306" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748b">9:16 clip</text>
</svg>
